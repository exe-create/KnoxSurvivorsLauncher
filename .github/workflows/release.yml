name: Build launcher release

on:
  push:
    branches:
      - main
      - fix/secondary-drives-and-launch-options
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Compile and verify on Linux/macOS
        if: runner.os != 'Windows'
        run: chmod +x scripts/build.sh && ./scripts/build.sh

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build release archives
        run: chmod +x scripts/build.sh && ./scripts/build.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KnoxSurvivorsLauncher
          path: |
            dist/KnoxSurvivorsLauncher-windows.zip
            dist/KnoxSurvivorsLauncher-linux.zip
            dist/KnoxSurvivorsLauncher-macos.zip
            dist/SHA256SUMS.txt
            dist/KnoxSurvivorsLauncher.jar
      - name: Publish secondary-drive test preview
        if: github.ref == 'refs/heads/fix/secondary-drives-and-launch-options'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.2-preview.1
          target_commitish: fix/secondary-drives-and-launch-options
          name: Knox Survivors Launcher v0.2.2 Preview 1
          prerelease: true
          draft: false
          generate_release_notes: false
          body: |
            Test preview for secondary Steam-library drives and custom launch options.

            Changes:
            - Detects Project Zomboid/Steam libraries on D:, E:, and other local drives without editing launcher scripts.
            - Expands bundled Java discovery for non-standard Project Zomboid layouts.
            - Adds a remembered Custom Launch Options field for options such as `-cachedir="D:\Zomboid"`.

            This is a preview build for testing before the changes are merged into main.
          files: |
            dist/KnoxSurvivorsLauncher-windows.zip
            dist/KnoxSurvivorsLauncher-linux.zip
            dist/KnoxSurvivorsLauncher-macos.zip
            dist/SHA256SUMS.txt
            dist/KnoxSurvivorsLauncher.jar
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Knox Survivors Launcher ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
          generate_release_notes: true
          body: |
            Knox Survivors Launcher release.

            The launcher verifies the subscribed Workshop files and Knox runtime, then starts
            Project Zomboid using the supported runtime path for the current Java NPC build.
            Users do not need to edit Java, Windows PATH, Steam launch options, or Project
            Zomboid files.
          files: |
            dist/KnoxSurvivorsLauncher-windows.zip
            dist/KnoxSurvivorsLauncher-linux.zip
            dist/KnoxSurvivorsLauncher-macos.zip
            dist/SHA256SUMS.txt
            dist/KnoxSurvivorsLauncher.jar
