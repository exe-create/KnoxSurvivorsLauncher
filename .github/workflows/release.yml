name: Build launcher release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Compile and verify on Linux/macOS
        if: runner.os != 'Windows'
        run: chmod +x scripts/build.sh && ./scripts/build.sh

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build release archives
        run: chmod +x scripts/build.sh && ./scripts/build.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KnoxSurvivorsLauncher
          path: |
            dist/KnoxSurvivorsLauncher-windows.zip
            dist/KnoxSurvivorsLauncher-linux.zip
            dist/KnoxSurvivorsLauncher-macos.zip
            dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          draft: true
          generate_release_notes: true
          body: |
            Preview launcher for the Knox Survivors IsoPlayer rebuild.

            The current public Workshop item may still be the older release. The launcher
            checks the subscribed files and will wait safely rather than combining mismatched
            Lua and Java builds.
          files: |
            dist/KnoxSurvivorsLauncher-windows.zip
            dist/KnoxSurvivorsLauncher-linux.zip
            dist/KnoxSurvivorsLauncher-macos.zip
            dist/SHA256SUMS.txt
